# Builds this fork on GitHub-hosted runners and publishes the engine NuGet packages,
# so a machine that cannot build Stride locally can still consume it.
#
# Trigger it by hand: Actions -> "Pack (Crafter)" -> Run workflow -> keep the branch
# dropdown on `crafter` and put the ref you actually want built into the `ref` input.
# The dropdown only selects which branch's *workflow file* runs; `ref` selects what gets
# checked out and packed, so master / a tag / a SHA are all buildable without copying
# this file onto them.
#
# Per run it produces, for that ref:
#   - Actions artifact  stride-packages-<ref>-<version>   (needs auth to download)
#   - Release assets on the per-ref prerelease tag `engine-packages-<ref>`:
#       stride-packages.zip   the nupkgs + manifest.json
#       manifest.json         version / ref / sha / run, readable without downloading the zip
#     Tokenless, constant URLs (this fork is public):
#       https://github.com/delustra/stride/releases/download/engine-packages-<ref>/stride-packages.zip
#       https://github.com/delustra/stride/releases/download/engine-packages-<ref>/manifest.json
#
# The package version is the ref's MajorMinor.Patch with the prerelease suffix
# -<version-suffix>.<run number> (4.5.0-dev.42), never the committed NuGetVersionSuffix, so no
# two runs publish the same version.
#
# Consume it from the CrafterDudes repo root:
#   scripts\stride.bat sync <ref>
#
# NOTE: build/package.proj builds the full Stride.slnx. A solution filter looks like a cheaper
# option but excludes Stride.Assets, Stride.Core.Assets, Stride.Core.Assets.CompilerApp and
# Stride.GameStudio, so it cannot produce a package set the game builds against.

name: Pack (Crafter)
run-name: Pack ${{ inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (e.g. crafter, master, a SHA). Its SharedAssemblyInfo.cs decides MajorMinor.Patch.'
        default: 'crafter'
        type: string
      version-suffix:
        description: 'Stem of the prerelease suffix, no leading dash; the run number is appended (dev -> 4.5.0-dev.42, which the game floats to).'
        default: 'dev'
        type: string
  push:
    branches:
      - crafter
    paths:
      - 'sources/**'
      - 'build/**'
      - 'deps/**'
      - '.github/workflows/pack-crafter.yml'

concurrency:
  group: pack-crafter-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write # create / refresh the per-ref release

jobs:
  Pack:
    name: Pack
    runs-on: windows-2025-vs2026
    steps:
      # `inputs` is empty on push, so fall back to the pushed branch.
      - name: Resolve target ref
        id: target
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then REF="${{ github.ref_name }}"; fi
          # Tag-safe slug: refs like feature/foo would otherwise nest the release tag.
          SLUG=$(echo "$REF" | sed 's#[^A-Za-z0-9._-]#-#g')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=engine-packages-$SLUG" >> "$GITHUB_OUTPUT"
          echo "::notice title=Target::$REF -> engine-packages-$SLUG"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          lfs: true
          submodules: true
          fetch-depth: 0 # full history + tags: the version machinery reads git metadata
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Package builds take the prerelease suffix from SharedAssemblyInfo.cs (through its generated
      # overlay); it is rewritten in the working copy only. `inputs` is empty on push, hence the default.
      - name: Stamp the run number into the version
        shell: pwsh
        run: |
          $f = 'sources/shared/SharedAssemblyInfo.cs'
          $s = Get-Content $f -Raw
          $suffix = '-${{ inputs.version-suffix || 'dev' }}.${{ github.run_number }}'
          if ($s -notmatch 'NuGetVersionSuffix = ".*?";') {
            echo "::error::No NuGetVersionSuffix line in $f"
            exit 1
          }
          Set-Content $f -NoNewline -Value ($s -replace 'NuGetVersionSuffix = ".*?";', "NuGetVersionSuffix = ""$suffix"";")
          echo "NuGetVersionSuffix -> $suffix"

      # -t:BuildPackages is release.yml's -t:Package without the SignPackage phase, so no
      # signing secrets are needed. StrideBuildPrerequisitesInstaller=false skips the
      # Advanced Installer step (licensed tool); install-prerequisites.exe is only used by
      # the launcher's install flow, not by a folder-feed consumer.
      # --no-restore: package.proj's targets restore their own solutions.
      - name: Build packages
        run: |
          dotnet build build\package.proj `
            -t:BuildPackages `
            --no-restore `
            -m -nr:false `
            -v:m -p:WarningLevel=0 `
            -p:StridePlatforms=Windows `
            -p:StrideGraphicsApiDependentBuildAll=true `
            -p:StrideSign=false `
            -p:StrideBuildPrerequisitesInstaller=false `
            -p:StrideNativeBuildMode=Clang
        env:
          StrideDisableAssetCompilerExecServerProxy: true

      - name: Write manifest
        id: manifest
        shell: pwsh
        run: |
          # Match only Stride.Core.<version>.nupkg, never Stride.Core.Assets.<version>.nupkg
          $pkgs = Get-ChildItem bin/packages -Filter '*.nupkg'
          $core = $pkgs | Where-Object { $_.Name -match '^Stride\.Core\.(\d.*)\.nupkg$' } | Select-Object -First 1
          if (-not $core) {
            echo "::error::No Stride.Core.<version>.nupkg found in bin/packages"
            exit 1
          }
          $version = [regex]::Match($core.Name, '^Stride\.Core\.(\d.*)\.nupkg$').Groups[1].Value

          # github.sha is the dispatch ref's SHA (this file's branch), not the ref we packed.
          $sha = (git rev-parse HEAD).Trim()

          [ordered]@{
            version     = $version
            ref         = '${{ steps.target.outputs.ref }}'
            sha         = $sha
            tag         = '${{ steps.target.outputs.tag }}'
            packages    = $pkgs.Count
            run         = '${{ github.run_number }}'
            runId       = '${{ github.run_id }}'
            runUrl      = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            builtAtUtc  = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content bin/packages/manifest.json -Encoding utf8

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "::notice title=Packed::$version from ${{ steps.target.outputs.ref }} @ $sha ($($pkgs.Count) packages)"
          echo "**Packed:** ``$version`` from ``${{ steps.target.outputs.ref }}`` @ ``$sha`` ($($pkgs.Count) packages)" >> $env:GITHUB_STEP_SUMMARY

      - name: Zip packages
        shell: pwsh
        run: |
          # Store-only: nupkgs are already deflated, so recompressing just burns minutes.
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=0 stride-packages.zip ./bin/packages/*.nupkg ./bin/packages/manifest.json | Out-Null
          } else {
            Compress-Archive -Path bin/packages/*.nupkg, bin/packages/manifest.json `
              -DestinationPath stride-packages.zip -CompressionLevel NoCompression
          }
          "{0:N1} MB" -f ((Get-Item stride-packages.zip).Length / 1MB)

      - name: Upload NuGet packages (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: stride-packages-${{ steps.target.outputs.ref }}-${{ steps.manifest.outputs.version }}
          path: bin/packages/*.nupkg
          if-no-files-found: error

      # Per-ref rolling prerelease: the tag is deleted and recreated on the packed commit, so
      # the asset URLs stay constant per ref and builds of different refs never clobber each
      # other. Anonymous download, so the local sync script needs no token.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ steps.target.outputs.tag }}'
          SHA=$(git rev-parse HEAD)
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" stride-packages.zip bin/packages/manifest.json \
            --target "$SHA" \
            --prerelease \
            --title "Engine packages ${{ steps.manifest.outputs.version }} (${{ steps.target.outputs.ref }})" \
            --notes "Stride \`${{ steps.manifest.outputs.version }}\` built from \`${{ steps.target.outputs.ref }}\` @ \`$SHA\` (run ${{ github.run_number }}).

          Sync locally, from the CrafterDudes repo root:
          \`\`\`
          scripts\\stride.bat sync ${{ steps.target.outputs.ref }}
          \`\`\`"
